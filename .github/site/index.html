<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Security Arsenal</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="description" content="Search open source tools to attack AI, defend AI and hack with AI, mapped to the OWASP GenAI Top 10 risks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --bg-2: #0f0f12;
  --panel: #09090b;
  --line: #1f1f23;
  --line-2: #27272a;
  --hover: #18181b;
  --text: #fafafa;
  --muted: #a1a1aa;
  --dim: #71717a;
  --ring: #d4d4d8;
  --red: #f87171;
  --cyan: #60a5fa;
  --lime: #4ade80;
  --blue: #a78bfa;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.55 var(--sans);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

/* Header */
header.top { padding-block: 40px 8px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title { display: flex; align-items: center; gap: 16px; }
.logo { display: block; flex: none; line-height: 0; }
.logo img { height: 56px; width: auto; }
h1 { margin: 0; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
h1 span { color: var(--muted); font-weight: 500; }
.links { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text);
  font: 500 13px/1 var(--sans); text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { background: #e4e4e7; }

/* Search */
.search { position: sticky; top: 0; z-index: 5; padding: 18px 0 14px; background: linear-gradient(var(--bg) 78%, transparent); }
.field { position: relative; }
.field svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; color: var(--dim); pointer-events: none; }
#q {
  width: 100%; padding: 13px 96px 13px 44px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--text);
  font: 400 17px/1.3 var(--sans);
}
#q::placeholder { color: var(--dim); }
#q:focus { outline: none; border-color: var(--dim); box-shadow: 0 0 0 3px rgba(212,212,216,.12); }
.field kbd, .field .clear { position: absolute; right: 14px; top: 50%; translate: 0 -50%; }
kbd { font: 500 12px/1 var(--mono); color: var(--dim); border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 7px; }
.clear { background: none; border: 0; color: var(--muted); font: 500 13px var(--sans); cursor: pointer; padding: 6px; }
/* Group tabs */
.groups { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 18px; }
.group {
  --c: var(--muted);
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 14px/1 var(--sans); cursor: pointer;
}
.group::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.group[data-g=""]::before { display: none; }
.group small { color: var(--dim); font-size: 12px; font-weight: 500; }
.group:hover { background: var(--hover); }
.group[aria-pressed="true"] { border-color: var(--line-2); background: var(--hover); }
.group[data-g=""][aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); }
.group[data-g=""][aria-pressed="true"] small { color: var(--dim); }

/* Layout */
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start; padding-bottom: 64px; }
aside { position: sticky; top: 124px; max-height: calc(100vh - 140px); overflow: auto; padding-right: 4px; }
aside h3 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
aside h3:first-child { margin-top: 0; }
.cats { list-style: none; margin: 0; padding: 0; }
.cats li label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.cats li label:hover { background: var(--hover); }
.cats input { accent-color: var(--text); margin: 0; }
.cats .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.cats .n { margin-left: auto; color: var(--dim); font-size: 12px; }
.cats .groupname { padding: 10px 6px 2px; font-size: 12px; color: var(--dim); }
.ctl { display: grid; gap: 6px; font-size: 14px; }
.ctl select, .ctl input[type=number] {
  width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--panel); color: var(--text); font: 400 14px var(--sans);
}
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }
.reset { margin-top: 18px; }

/* Results */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 14px; }
.count strong { color: var(--text); }
.sort { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
.sort select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font: 400 13px var(--sans); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-2); font-size: 12px; color: var(--muted); }
.chip button { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.chip button:hover { color: var(--text); }

ol.results { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.tool {
  --c: var(--muted);
  display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; padding: 14px 4px 14px 16px;
  border-bottom: 1px solid var(--line); position: relative;
}
.tool::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 2px; border-radius: 2px; background: var(--c); opacity: .7; }
.tool:hover { background: var(--hover); }
.tool h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.tool h4 a { text-decoration: none; }
.tool h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.tool .repo { font: 400 12px/1.4 var(--mono); color: var(--dim); margin-left: 8px; word-break: break-all; }
.tool .desc { margin: 2px 0 6px; color: var(--muted); font-size: 14px; max-width: 78ch; }
.tool .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-2);
  background: transparent; color: var(--muted); font: 500 12px/1.5 var(--sans); cursor: pointer;
}
.tag:hover { color: var(--text); background: var(--hover); }
.tag.risk { font-family: var(--mono); font-size: 11px; }
.tag.arch { border-color: #7c5a12; color: #fbbf24; cursor: default; }
.stats { text-align: right; white-space: nowrap; }
.stars { font: 600 15px/1.2 var(--sans); }
.stars svg { color: #fbbf24; vertical-align: -2px; margin-right: 4px; }
.updated { color: var(--dim); font-size: 12px; margin-top: 4px; }
.updated.stale { color: #b45309; }
mark { background: rgba(250,250,250,.16); color: var(--text); border-radius: 3px; padding: 0 1px; }
.empty { padding: 48px 0; color: var(--muted); }
.empty p { margin: 0 0 12px; }
.more { display: block; margin: 20px auto 0; }

footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--dim); font-size: 13px; }
footer a { color: var(--muted); }

.filters-toggle { display: none; }
.groups { scroll-margin-top: 120px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  aside { position: static; max-height: none; display: none; padding: 4px 0 16px; }
  aside.open { display: block; }
  .filters-toggle { display: inline-flex; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  header.top { padding-block-start: 28px; }
  .logo img { height: 40px; }
  .title { gap: 12px; }
  #q { font-size: 16px; padding-right: 60px; }
  .tool { grid-template-columns: 1fr; }
  .stats { text-align: left; display: flex; gap: 12px; align-items: baseline; }
  .updated { margin: 0; }
  .tool .repo { display: block; margin: 2px 0 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .group, .btn { transition: border-color .15s, background-color .15s, box-shadow .15s; }
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand">
    <div class="title">
      <a class="logo" href="https://happyhacking.space" aria-label="Happy Hacking Space"><img src="logo.svg" alt="" width="68" height="56"></a>
      <h1>AI Security Arsenal</h1>
    </div>
    <nav class="links" aria-label="Project">
      <a class="btn primary" href="https://github.com/HappyHackingSpace/ai-security-arsenal/issues/new?template=add-tool.yml">Suggest a tool</a>
    </nav>
  </div>
</header>

<div class="search">
  <div class="wrap">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search tools"
             placeholder="Search tools, owners, descriptions…">
      <kbd id="slash" aria-hidden="true">/</kbd>
      <button class="clear" id="clear" type="button" hidden>Clear</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="groups" id="groups" role="group" aria-label="Filter by group"></div>
  <div class="layout">
    <aside id="filters" aria-label="Filters">
      <h3>Categories</h3>
      <ul class="cats" id="cats"></ul>
      <h3>Stars</h3>
      <label class="ctl">At least
        <input type="number" id="min" min="0" step="100" inputmode="numeric" placeholder="Any">
      </label>
      <h3>Activity</h3>
      <label class="ctl">Last commit
        <select id="age">
          <option value="">Any time</option>
          <option value="30">Within 30 days</option>
          <option value="90">Within 3 months</option>
          <option value="365">Within a year</option>
        </select>
      </label>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="arch"> Hide archived repos</label>
      <button class="btn reset" id="reset" type="button">Reset filters</button>
    </aside>

    <section aria-label="Results">
      <div class="bar">
        <div class="count" id="count" aria-live="polite"></div>
        <div class="sort">
          <button class="btn filters-toggle" id="filters-toggle" type="button" aria-controls="filters" aria-expanded="false">Filters</button>
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="">Best match</option>
            <option value="stars">Most stars</option>
            <option value="updated">Recently updated</option>
            <option value="name">Name</option>
          </select>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <ol class="results" id="results"></ol>
      <button class="btn more" id="more" type="button" hidden>Show more</button>
    </section>
  </div>
</main>

<footer>
  <div class="wrap" id="foot">Data from <a href="https://github.com/HappyHackingSpace/ai-security-arsenal">HappyHackingSpace/ai-security-arsenal</a>. MIT licensed.</div>
</footer>

<script>
"use strict";
const GROUPS = {
  "Attack AI": { key: "attack", color: "var(--red)" },
  "Defend AI": { key: "defend", color: "var(--cyan)" },
  "Hack with AI": { key: "hack", color: "var(--lime)" },
  "Practice & Measure": { key: "practice", color: "var(--blue)" },
};
const LLM = {
  LLM01: "Prompt Injection", LLM02: "Sensitive Information Disclosure", LLM03: "Supply Chain",
  LLM04: "Data and Model Poisoning", LLM05: "Improper Output Handling", LLM06: "Excessive Agency",
  LLM07: "System Prompt Leakage", LLM08: "Vector and Embedding Weaknesses", LLM09: "Misinformation",
  LLM10: "Unbounded Consumption",
};
const PAGE = 60;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const norm = (s) => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
const squash = (s) => s.replace(/[^a-z0-9]/g, "");
const fmtStars = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(n);
const DAY = 864e5;
const now = Date.now();
function ago(iso) {
  if (!iso) return "no commits";
  const d = Math.max(0, Math.round((now - Date.parse(iso)) / DAY));
  if (d < 1) return "today";
  if (d < 45) return `${d} day${d === 1 ? "" : "s"} ago`;
  if (d < 365) return `${Math.round(d / 30)} months ago`;
  const y = Math.round(d / 365 * 10) / 10;
  return `${y} year${y === 1 ? "" : "s"} ago`;
}

let DATA, CATS = {}, page = PAGE;
const state = { q: "", g: "", cats: new Set(), risks: new Set(), min: "", age: "", arch: false, sort: "" };

/* ---------- query parsing ---------- */
function parseQuery(q) {
  const out = { terms: [], not: [], ops: [] };
  const re = /(-?)(?:(\w+):)?(?:"([^"]*)"|(\S+))/g;
  let m;
  while ((m = re.exec(q))) {
    const neg = m[1] === "-", key = m[2] && m[2].toLowerCase(), val = m[3] ?? m[4] ?? "";
    if (!val) continue;
    if (key && ["cat", "group", "risk", "owner", "stars", "updated", "is"].includes(key)) out.ops.push({ key, val: norm(val), neg });
    else (neg ? out.not : out.terms).push(norm(key ? `${key}:${val}` : val));
  }
  return out;
}
function cmpNum(spec, n) {
  let m;
  if ((m = spec.match(/^(\d+)\.\.(\d+)$/))) return n >= +m[1] && n <= +m[2];
  if ((m = spec.match(/^(>=|<=|>|<)?(\d+)k?$/))) {
    const v = +m[2] * (spec.endsWith("k") ? 1000 : 1);
    return { ">": n > v, "<": n < v, ">=": n >= v, "<=": n <= v, undefined: n >= v }[m[1]];
  }
  return true;
}
function ageDays(spec) {
  const m = spec.match(/^(\d+)([dwmy])$/);
  return m ? +m[1] * { d: 1, w: 7, m: 30, y: 365 }[m[2]] : null;
}
function cmpDate(spec, iso) {
  const m = spec.match(/^(>|<)?(.+)$/);
  const op = m[1] || "<", v = m[2];
  if (!iso) return false;
  const t = Date.parse(iso), days = ageDays(v);
  if (days !== null) { const lim = now - days * DAY; return op === "<" ? t >= lim : t < lim; }
  const d = Date.parse(v);
  if (isNaN(d)) return true;
  return op === ">" ? t >= d : t < d;
}
function opMatch(t, { key, val }) {
  const c = CATS[t.cat];
  switch (key) {
    case "cat": return t.cat === val || norm(c.title).includes(val);
    case "group": return GROUPS[c.group].key.startsWith(val) || norm(c.group).includes(val);
    case "risk": return c.risks.some((r) => norm(r).startsWith(val));
    case "owner": return norm(t.repo.split("/")[0]).includes(val);
    case "stars": return cmpNum(val, t.stars);
    case "updated": return cmpDate(val, t.pushed);
    case "is": return val === "archived" ? t.archived : true;
  }
  return true;
}
function score(t, terms) {
  let s = 0;
  for (const w of terms) {
    const sw = squash(w);
    const hit = (f) => t._[f].includes(w) || (sw && t._s[f].includes(sw));
    if (t._.name.startsWith(w)) s += 12;
    else if (hit("name")) s += 8;
    else if (hit("repo")) s += 5;
    else if (hit("desc")) s += 3;
    else if (hit("cat")) s += 1;
    else return -1;
  }
  return s;
}

/* ---------- filtering ---------- */
function filtered({ skip } = {}) {
  const q = parseQuery(state.q);
  const ageLim = state.age ? now - +state.age * DAY : 0;
  const min = +state.min || 0;
  const out = [];
  for (const t of DATA.tools) {
    const c = CATS[t.cat];
    if (skip !== "g" && state.g && GROUPS[c.group].key !== state.g) continue;
    if (skip !== "cats" && state.cats.size && !state.cats.has(t.cat)) continue;
    if (skip !== "risks" && state.risks.size && !c.risks.some((r) => state.risks.has(r))) continue;
    if (t.stars < min) continue;
    if (ageLim && (!t.pushed || Date.parse(t.pushed) < ageLim)) continue;
    if (state.arch && t.archived) continue;
    if (!q.ops.every((o) => opMatch(t, o) !== o.neg)) continue;
    if (q.not.some((w) => t._.all.includes(w) || t._s.all.includes(squash(w)))) continue;
    const s = q.terms.length ? score(t, q.terms) : 0;
    if (s < 0) continue;
    out.push({ t, s });
  }
  const by = {
    stars: (a, b) => b.t.stars - a.t.stars,
    updated: (a, b) => (b.t.pushed || "").localeCompare(a.t.pushed || ""),
    name: (a, b) => a.t.name.localeCompare(b.t.name, undefined, { sensitivity: "base" }),
    "": (a, b) => b.s - a.s || b.t.stars - a.t.stars,
  }[state.sort];
  return { list: out.sort(by), terms: q.terms };
}

/* ---------- rendering ---------- */
function highlight(text, terms) {
  let html = esc(text);
  const words = terms.filter((w) => w.length > 1).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return html;
  return html.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>");
}
function renderGroups() {
  const counts = {};
  for (const { t } of filtered({ skip: "g" }).list) { const k = GROUPS[CATS[t.cat].group].key; counts[k] = (counts[k] || 0) + 1; }
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  $("#groups").innerHTML = [["", "All", "", total], ...Object.entries(GROUPS).map(([n, g]) => [g.key, n, g.color, counts[g.key] || 0])]
    .map(([k, n, c, x]) => `<button type="button" class="group" data-g="${k}" style="--c:${c || "var(--muted)"}" aria-pressed="${state.g === k}">${esc(n)} <small>${x}</small></button>`).join("");
}
const riskLabel = (r) => LLM[r] || r;
function renderCats() {
  const counts = {};
  for (const { t } of filtered({ skip: "cats" }).list) counts[t.cat] = (counts[t.cat] || 0) + 1;
  let html = "", last = "";
  for (const c of DATA.categories) {
    if (c.group !== last) { html += `<li class="groupname">${esc(c.group)}</li>`; last = c.group; }
    html += `<li><label title="${esc(c.blurb)}"><input type="checkbox" value="${c.key}" ${state.cats.has(c.key) ? "checked" : ""}>
      <span class="dot" style="background:${GROUPS[c.group].color}"></span>${esc(c.title)}<span class="n">${counts[c.key] || 0}</span></label></li>`;
  }
  $("#cats").innerHTML = html;
}
function renderChips() {
  const chips = [];
  if (state.g) chips.push(["g", "", Object.keys(GROUPS).find((n) => GROUPS[n].key === state.g)]);
  for (const k of state.cats) chips.push(["cat", k, CATS[k].title]);
  for (const r of state.risks) chips.push(["risk", r, riskLabel(r)]);
  if (state.min) chips.push(["min", "", `${state.min}+ stars`]);
  if (state.age) chips.push(["age", "", $("#age").selectedOptions[0].textContent]);
  if (state.arch) chips.push(["arch", "", "No archived"]);
  $("#chips").innerHTML = chips.map(([k, v, l]) =>
    `<span class="chip">${esc(l)}<button type="button" data-k="${k}" data-v="${esc(v)}" aria-label="Remove filter ${esc(l)}">×</button></span>`).join("");
}
function renderResults() {
  const { list, terms } = filtered();
  const total = DATA.tools.length;
  $("#count").innerHTML = list.length === total ? `<strong>${total}</strong> tools` : `<strong>${list.length}</strong> of ${total} tools`;
  if (!list.length) {
    $("#results").innerHTML = `<li class="empty"><p>No tools match these filters.</p>
      <button class="btn" type="button" id="empty-reset">Clear search and filters</button></li>`;
    $("#more").hidden = true;
    return;
  }
  $("#results").innerHTML = list.slice(0, page).map(({ t }) => {
    const c = CATS[t.cat], g = GROUPS[c.group];
    const stale = t.pushed && now - Date.parse(t.pushed) > 365 * DAY;
    return `<li class="tool" style="--c:${g.color}">
      <div>
        <h4><a href="https://github.com/${esc(t.repo)}" target="_blank" rel="noopener">${highlight(t.name, terms)}</a><span class="repo">${highlight(t.repo, terms)}</span></h4>
        <p class="desc">${t.desc ? highlight(t.desc, terms) : "<em>No description</em>"}</p>
        <div class="meta">
          <button type="button" class="tag" data-cat="${c.key}" title="${esc(c.blurb)}">${esc(c.title)}</button>
          ${t.archived ? `<span class="tag arch">Archived</span>` : ""}
        </div>
      </div>
      <div class="stats">
        <div class="stars"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>${fmtStars(t.stars)}</div>
        <div class="updated${stale ? " stale" : ""}" title="Last commit ${esc(t.pushed || "unknown")}">${ago(t.pushed)}</div>
      </div>
    </li>`;
  }).join("");
  $("#more").hidden = list.length <= page;
  $("#more").textContent = `Show ${Math.min(PAGE, list.length - page)} more`;
}
function render({ keepPage } = {}) {
  if (!keepPage) page = PAGE;
  $("#clear").hidden = !state.q;
  $("#slash").hidden = !!state.q;
  renderGroups(); renderCats(); renderChips(); renderResults();
  writeURL();
}

/* ---------- URL state ---------- */
function writeURL() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.g) p.set("group", state.g);
  if (state.cats.size) p.set("cat", [...state.cats].join(","));
  if (state.risks.size) p.set("risk", [...state.risks].join(","));
  if (state.min) p.set("stars", state.min);
  if (state.age) p.set("days", state.age);
  if (state.arch) p.set("archived", "hide");
  if (state.sort) p.set("sort", state.sort);
  const qs = p.toString();
  history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
}
function readURL() {
  const p = new URLSearchParams(location.search);
  state.q = p.get("q") || "";
  state.g = Object.values(GROUPS).some((g) => g.key === p.get("group")) ? p.get("group") : "";
  state.cats = new Set((p.get("cat") || "").split(",").filter((k) => CATS[k]));
  state.risks = new Set((p.get("risk") || "").split(",").filter((r) => DATA.risks.has(r)));
  state.min = /^\d+$/.test(p.get("stars") || "") ? p.get("stars") : "";
  state.age = ["30", "90", "365"].includes(p.get("days")) ? p.get("days") : "";
  state.arch = p.get("archived") === "hide";
  state.sort = ["stars", "updated", "name"].includes(p.get("sort")) ? p.get("sort") : "";
  $("#q").value = state.q; $("#min").value = state.min; $("#age").value = state.age;
  $("#arch").checked = state.arch; $("#sort").value = state.sort;
}

/* ---------- events ---------- */
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
function resetAll() {
  Object.assign(state, { q: "", g: "", min: "", age: "", arch: false });
  state.cats.clear(); state.risks.clear();
  $("#q").value = ""; $("#min").value = ""; $("#age").value = ""; $("#arch").checked = false;
  render();
}
function bind() {
  let timer;
  $("#q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 80); });
  $("#q").addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#q").value = ""; state.q = ""; render(); } });
  $("#clear").addEventListener("click", () => { $("#q").value = ""; state.q = ""; render(); $("#q").focus(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  });
  $("#groups").addEventListener("click", (e) => { const b = e.target.closest(".group"); if (b) { state.g = b.dataset.g; render(); } });
  $("#cats").addEventListener("change", (e) => { toggle(state.cats, e.target.value); render(); });
  $("#min").addEventListener("input", (e) => { state.min = /^\d+$/.test(e.target.value) ? e.target.value : ""; render(); });
  $("#age").addEventListener("change", (e) => { state.age = e.target.value; render(); });
  $("#arch").addEventListener("change", (e) => { state.arch = e.target.checked; render(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#reset").addEventListener("click", resetAll);
  $("#more").addEventListener("click", () => { page += PAGE; renderResults(); });
  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const { k, v } = b.dataset;
    if (k === "g") state.g = "";
    if (k === "cat") state.cats.delete(v);
    if (k === "risk") state.risks.delete(v);
    if (k === "min") { state.min = ""; $("#min").value = ""; }
    if (k === "age") { state.age = ""; $("#age").value = ""; }
    if (k === "arch") { state.arch = false; $("#arch").checked = false; }
    render();
  });
  $("#results").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "empty-reset") return resetAll();
    if (b.dataset.cat) { state.cats = new Set([b.dataset.cat]); render(); }
    if (b.dataset.risk) { state.risks = new Set([b.dataset.risk]); render(); }
    $("#groups").scrollIntoView({ behavior: smooth() });
  });
  $("#filters-toggle").addEventListener("click", (e) => {
    const open = $("#filters").classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", open);
  });
}

/* ---------- boot ---------- */
fetch("tools.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DATA = d;
  DATA.risks = new Set(d.categories.flatMap((c) => c.risks));
  for (const c of d.categories) CATS[c.key] = c;
  for (const t of d.tools) {
    const c = CATS[t.cat];
    t._ = { name: norm(t.name), repo: norm(t.repo), desc: norm(t.desc), cat: norm(`${c.title} ${c.group} ${c.key}`) };
    t._.all = `${t._.name} ${t._.repo} ${t._.desc} ${t._.cat}`;
    t._s = Object.fromEntries(Object.entries(t._).map(([k, v]) => [k, squash(v)]));
  }
  $("#foot").insertAdjacentHTML("beforeend", ` Stars and activity as of ${esc(d.generated)}.`);
  readURL(); bind(); render();
}).catch((err) => {
  $("#results").innerHTML = `<li class="empty"><p>Couldn't load tools.json (${esc(err.message)}). Run <code>python3 .github/scripts/build.py</code>, then serve this folder over HTTP.</p></li>`;
});
</script>
</body>
</html>
